<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poda Closet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Poda Capital</p>
        <h1>Closet OS</h1>
        <p class="subhead">Track your closet, listed pieces, and sold archive from one Google Sheet.</p>
      </div>
      <a class="sheet-link" href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSEYtCDQrbxiln-82ECtRwK_8hq6_3bo0uVGu1IRKtKEuVqsk8xWQ2x_sL7CatdyQ/pub?gid=2076140585&single=true&output=csv" target="_blank" rel="noopener">CSV Source</a>
    </header>

    <section class="metrics-grid" aria-label="Closet metrics">
      <article class="metric-card">
        <span>Total Items</span>
        <strong id="metricItems">—</strong>
      </article>
      <article class="metric-card">
        <span>Closet Value</span>
        <strong id="metricClosetValue">—</strong>
      </article>
      <article class="metric-card">
        <span>Listed Value</span>
        <strong id="metricListedValue">—</strong>
      </article>
      <article class="metric-card">
        <span>Sold Revenue</span>
        <strong id="metricSoldRevenue">—</strong>
      </article>
    </section>

    <section class="controls">
      <div class="toggle-group" aria-label="Status filters">
        <button class="toggle active" data-filter="All">All</button>
        <button class="toggle" data-filter="Closet">Closet</button>
        <button class="toggle" data-filter="Listed">Listed</button>
        <button class="toggle" data-filter="Sold">Sold</button>
      </div>

      <label class="search-wrap">
        <span>Search</span>
        <input id="searchInput" type="search" placeholder="Brand, item, category..." />
      </label>
    </section>

    <section id="statusMessage" class="status-message">Loading closet data...</section>

    <section id="itemsGrid" class="items-grid" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
